# Digital Signage - production stack for Coolify (Docker Compose deployment)
#
# 4 independent, separately-scalable services + their own containers:
#   postgres, minio, backend, admin-frontend, player-app
#
# All configuration is via environment variables — set them in the Coolify
# UI (Environment Variables tab of this resource). No domain or secret is
# hardcoded here. After first deploy, assign a public Domain to each of
# backend / admin-frontend / player-app / minio from their own Configuration
# tab in Coolify.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-signage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-signage}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-signage}']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET}
    volumes:
      - minio_data:/data
    ports:
      - '9000'
      - '9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend-api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS}
      DATABASE_URL: postgresql://${POSTGRES_USER:-signage}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-signage}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      S3_ENDPOINT: minio
      S3_PORT: 9000
      S3_USE_SSL: 'false'
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_KEY: ${S3_KEY}
      S3_SECRET: ${S3_SECRET}
      S3_BUCKET: ${S3_BUCKET:-signage-media}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
    ports:
      - '3000'

  admin-frontend:
    build:
      context: ../admin-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${API_URL}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_URL: ${API_URL}
    ports:
      - '8080'

  player-app:
    build:
      context: ../player-app
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${API_URL}
        VITE_WS_URL: ${WS_URL}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_URL: ${API_URL}
      WS_URL: ${WS_URL}
    ports:
      - '8080'

volumes:
  postgres_data:
  minio_data:
