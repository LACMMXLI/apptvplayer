# Digital Signage - production stack for Coolify (Docker Compose deployment)
#
# 5 independent, separately-scalable services + their own containers:
#   postgres, rustfs, backend, admin-frontend, player-app
#
# All configuration is via environment variables — set them in the Coolify
# UI (Environment Variables tab of this resource). No domain or secret is
# hardcoded here. After first deploy, assign a public Domain to each of
# backend / admin-frontend / player-app / rustfs from their own Configuration
# tab in Coolify.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-signage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-signage}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-signage}']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Keep the service name for the backend's S3_ENDPOINT while replacing the
    # MinIO image, which no longer allows anonymous pulls from Docker Hub/Quay.
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${S3_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET}
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_VOLUMES: /data
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/health']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: backend-api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS}
      DATABASE_URL: postgresql://${POSTGRES_USER:-signage}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-signage}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Behind Coolify's reverse proxy: trust 1 hop so rate limiting sees the
      # real client IP instead of the proxy's.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      S3_ENDPOINT: minio
      S3_PORT: 9000
      S3_USE_SSL: 'false'
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_KEY: ${S3_KEY}
      S3_SECRET: ${S3_SECRET}
      S3_BUCKET: ${S3_BUCKET:-signage-media}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
    ports:
      - '3000'

  admin-frontend:
    build:
      context: admin-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${API_URL}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_URL: ${API_URL}
    ports:
      - '8080'

  player-app:
    build:
      context: player-app
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${API_URL}
        VITE_WS_URL: ${WS_URL}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_URL: ${API_URL}
      WS_URL: ${WS_URL}
      # Public URL of the admin panel; enables the QR code on the pairing screen.
      ADMIN_URL: ${ADMIN_URL:-}
    ports:
      - '8080'

volumes:
  postgres_data:
  rustfs_data:
