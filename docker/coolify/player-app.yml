services:
  player-app:
    build:
      context: player-app
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_URL: ${API_URL:?Set API_URL}
      WS_URL: ${WS_URL:?Set WS_URL}
      ADMIN_URL: ${ADMIN_URL:?Set ADMIN_URL}
    expose:
      - '8080'
    networks:
      coolify:
        aliases:
          - apptv-player

networks:
  coolify:
    external: true
    name: coolify
