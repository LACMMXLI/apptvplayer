services:
  backend:
    build:
      context: backend-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      DATABASE_URL: postgresql://${POSTGRES_USER:-signage}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@apptv-postgres:5432/${POSTGRES_DB:-signage}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      S3_ENDPOINT: apptv-rustfs
      S3_PORT: 9000
      S3_USE_SSL: 'false'
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_KEY: ${S3_KEY:?Set S3_KEY}
      S3_SECRET: ${S3_SECRET:?Set S3_SECRET}
      S3_BUCKET: ${S3_BUCKET:-signage-media}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:?Set S3_PUBLIC_URL}
    expose:
      - '3000'
    networks:
      coolify:
        aliases:
          - apptv-backend

networks:
  coolify:
    external: true
    name: coolify
