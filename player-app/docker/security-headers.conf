# Included from every `location` in nginx.conf. nginx drops inherited
# add_header directives as soon as a location defines its own, so these
# cannot simply live at the server level.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Scripts only from this origin (no inline, no eval). The API/storage hosts
# are set at runtime, so connect/img/media stay open to any http(s) origin;
# blob: is needed for media served from the offline cache. Framing is limited
# to the same origin (some kiosk shells wrap the player in a frame).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: http: https:; media-src 'self' data: blob: http: https:; connect-src 'self' http: https: ws: wss:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
